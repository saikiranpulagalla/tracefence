name: Lock reproducibility

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  native-locks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            runtime_lock: requirements-lock/runtime-linux.txt
            full_lock: requirements-lock/full-linux.txt
          - runner: windows-latest
            platform: windows
            runtime_lock: requirements-lock/runtime-windows.txt
            full_lock: requirements-lock/full-windows.txt
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate native locks in a fresh compiler environment
        run: python scripts/compile_locks.py --platform ${{ matrix.platform }}
      - name: Detect first native regeneration difference
        id: first_regeneration
        shell: pwsh
        run: |
          $paths = @(
            "requirements-lock/runtime-${{ matrix.platform }}.txt",
            "requirements-lock/development.txt",
            "requirements-lock/build.txt",
            "requirements-lock/full-${{ matrix.platform }}.txt"
          )
          $changedFiles = @(git diff --name-only -- $paths)
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --name-only failed with exit code $LASTEXITCODE"
          }
          $hasDiff = $changedFiles.Count -gt 0
          "changed=$($hasDiff.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          if ($hasDiff) {
            git diff -- $paths | Out-File -FilePath windows-lock-diff.txt -Encoding utf8NoBOM
            if ($LASTEXITCODE -ne 0) {
              throw "git diff failed with exit code $LASTEXITCODE"
            }
          }
      - name: Preserve Windows native bootstrap evidence
        if: matrix.platform == 'windows' && steps.first_regeneration.outputs.changed == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-lock-evidence/requirements-lock | Out-Null
          $locks = @(
            "requirements-lock/runtime-windows.txt",
            "requirements-lock/development.txt",
            "requirements-lock/build.txt",
            "requirements-lock/full-windows.txt"
          )
          foreach ($lock in $locks) {
            Copy-Item -LiteralPath $lock -Destination (Join-Path "native-lock-evidence" $lock)
          }
          Copy-Item -LiteralPath windows-lock-diff.txt -Destination native-lock-evidence/
          $manifest = foreach ($lock in $locks) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $lock).Hash.ToLowerInvariant()
            "$hash  $lock"
          }
          $manifest | Set-Content -Path native-lock-evidence/windows-lock-sha256.txt -Encoding utf8NoBOM
      - name: Upload Windows bootstrap evidence before failure
        if: matrix.platform == 'windows' && steps.first_regeneration.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-lock-bootstrap-${{ github.sha }}
          path: native-lock-evidence
          if-no-files-found: error
      - name: Fail after preserving Windows bootstrap evidence
        if: matrix.platform == 'windows' && steps.first_regeneration.outputs.changed == 'true'
        shell: pwsh
        run: |
          Write-Error "Native Windows generated locks differ from committed bootstrap candidates; evidence was uploaded for review."
          exit 1
      - name: Regenerate native locks in a second fresh compiler environment
        shell: pwsh
        run: |
          python scripts/compile_locks.py --platform ${{ matrix.platform }}
          $paths = @(
            "requirements-lock/runtime-${{ matrix.platform }}.txt",
            "requirements-lock/development.txt",
            "requirements-lock/build.txt",
            "requirements-lock/full-${{ matrix.platform }}.txt"
          )
          $changedFiles = @(git diff --name-only -- $paths)
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --name-only failed with exit code $LASTEXITCODE"
          }
          if ($changedFiles.Count -gt 0) {
            throw "Second native regeneration differs from committed locks: $($changedFiles -join ', ')"
          }
      - name: Install and audit native full environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r requirements-lock/development.txt -r ${{ matrix.full_lock }}
          python -m pip_audit --local --progress-spinner off
      - name: Locked import smoke test
        run: python -c "import cryptography, mcp, tracefence"
      - name: Verify Windows-only dependency is installed natively
        if: matrix.platform == 'windows'
        run: python -c "import win32api"
      - name: Run native platform tooling tests
        run: python -m pytest tests/unit/test_lock_platform_selection.py -q
